name: Build Android APK with Kivy Docker

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Cache Buildozer Global Directory
      uses: actions/cache@v4
      with:
        path: .buildozer
        key: ${{ runner.os }}-buildozer-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Build APK using Official Kivy Docker Image
      uses: docker://kivy/buildozer:latest
      with:
        # ⚡ Root वार्निंग को बायपास करने के लिए warn_on_root=0 पर्यावरण में इंजेक्ट किया गया है
        args: buildozer --global warn_on_root=0 android debug

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: Finished-Android-APK
        path: bin/*.apk
