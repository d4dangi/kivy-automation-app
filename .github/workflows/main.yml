name: Build Android APK with Native Buildozer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev sqlite3 bzip2 libbz2-dev aidl

    - name: Install Buildozer & Cython
      run: |
        pip install --upgrade pip
        pip install "buildozer>=1.5.0" "cython<3.0.0" virtualenv

    - name: Auto-Accept Android SDK Licenses
      run: |
        # Buildozer का बेस पाथ पहले ही बना देना ताकि sdkmanager टूल्स को पहचाने
        mkdir -p /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin
        
        # Google के लाइसेंस एग्रीमेंट्स को ऑटोमैटिकली 'Yes' फीड करना
        mkdir -p /home/runner/.buildozer/android/platform/android-sdk/licenses
        echo -e "893547e6f24752693858c1884f6b3d6c374f4c22\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de959a0045c849d275f48" > /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo -e "601085b94cd77f6b54b86885e83885753046f9d1" > /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license

    - name: Build with Buildozer
      run: |
        buildozer android debug
      env:
        ACCEPT_SDK_LICENSE_ACCEPTANCE: 'y'

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: Finished-Android-APK
        path: bin/*.apk
