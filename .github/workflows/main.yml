name: Build Android APK with Native Buildozer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies & Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf automake libtool libtool-bin m4 pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev sqlite3 bzip2 libbz2-dev aidl
        
        # मैक्रो रिपोजिटरी को फोर्स-अपडेट करना ताकि C-level क्रैश रुक जाए
        sudo ln -sf /usr/share/aclocal/libtool.m4 /usr/share/aclocal/ltoptions.m4

    - name: Install Buildozer & Cython
      run: |
        pip install --upgrade pip
        pip install "buildozer>=1.5.0" "cython<3.0.0" virtualenv

    - name: Fix Buildozer Hardcoded Path Trap
      run: |
        sudo mkdir -p /usr/local/lib/android/sdk/tools/bin/
        sudo ln -sf /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager /usr/local/lib/android/sdk/tools/bin/sdkmanager
        
        sudo mkdir -p /usr/local/lib/android/sdk/build-tools/34.0.0/
        sudo ln -sf /usr/bin/aidl /usr/local/lib/android/sdk/build-tools/34.0.0/aidl

    - name: Force Accept System SDK Licenses
      run: |
        yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses

    - name: Build with Buildozer
      run: |
        export ANDROID_HOME=/usr/local/lib/android/sdk
        export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
        export ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/25.2.9519653
        export ANDROID_NDK_ROOT=/usr/local/lib/android/sdk/ndk/25.2.9519653
        export ANDROID_NDK=/usr/local/lib/android/sdk/ndk/25.2.9519653
        
        # ⚡ पुराने libffi टूटे हुए मैक्रोज़ के क्रैश को रोकने के लिए पर्यावरण को मजबूत करना
        export P4A_RECONSTRUCT_ENV=1
        
        buildozer android debug
