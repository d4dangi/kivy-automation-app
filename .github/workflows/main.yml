name: Build Android APK with Buildozer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Cloud Server
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies & AIDL
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev sqlite3 bzip2 libbz2-dev aidl

    - name: Install Buildozer & Dependencies
      run: |
        pip install --upgrade pip
        pip install "buildozer>=1.5.0" "cython<3.0.0" virtualenv

    - name: Trick Buildozer with Correct SDK and Legacy Symlinks
      run: |
        # 1. Buildozer के लिए बेस डायरेक्टरी और उसके अंदर का Android SDK फोल्डर तैयार करना
        mkdir -p /home/runner/.buildozer/android/platform/
        
        # 2. GitHub सर्वर की ओरिजिनल SDK को यहाँ सॉफ्ट-लिंक करना
        ln -s $ANDROID_HOME /home/runner/.buildozer/android/platform/android-sdk
        
        # 3. ⚡ सबसे ज़रूरी: वह लेगेसी पाथ बनाना जिसे Buildozer ढूंढ रहा है
        mkdir -p /home/runner/.buildozer/android/platform/android-sdk/tools/bin/
        
        # 4. सर्वर के असली sdkmanager को उस लेगेसी पाथ से लिंक कर देना ताकि एरर ख़त्म हो जाए
        ln -sf /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager /home/runner/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
        
        # 5. कंपैटिबिलिटी के लिए aidl को भी सही जगह पर मैप करना
        mkdir -p /home/runner/.buildozer/android/platform/android-sdk/build-tools/33.0.0/
        ln -sf /usr/bin/aidl /home/runner/.buildozer/android/platform/android-sdk/build-tools/33.0.0/aidl

    - name: Build with Buildozer (Memory-Optimized)
      run: |
        export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx2048m -Dorg.gradle.workers.max=1"
        buildozer android debug
      env:
        ACCEPT_SDK_LICENSE_ACCEPTANCE: 'y'

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: Finished-Android-APK
        path: bin/*.apk
