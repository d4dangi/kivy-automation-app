name: Build Android APK with Buildozer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Cloud Server
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev sqlite3 bzip2 libbz2-dev aidl

    - name: Install Buildozer & Dependencies
      run: |
        pip install --upgrade pip
        pip install "buildozer>=1.5.0" "cython<3.0.0" virtualenv

    - name: Build with Buildozer (Memory-Optimized)
      run: |
        # GitHub के प्री-इंस्टॉल्ड SDK पाथ को एनवायरनमेंट में सेट करना ताकि Buildozer को खुद से कुछ डाउनलोड न करना पड़े
        export ANDROID_SDK_ROOT=$ANDROID_HOME
        
        # सिंगल थ्रेड में चलाना और रैम यूसेज लिमिट सेट करना
        export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx2048m -Dorg.gradle.workers.max=1"
        
        buildozer android debug
      env:
        ACCEPT_SDK_LICENSE_ACCEPTANCE: 'y'

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: Finished-Android-APK
        path: bin/*.apk
