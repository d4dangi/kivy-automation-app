name: Build Android APK with Kivy Docker

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Build APK inside Fixed Docker Shell
      run: |
        # ⚡ यहाँ हमारा 'yes' इनपुट सीधे Docker के अंदर फोर्सफुली ट्रांसफर हो जाएगा
        yes | docker run --rm \
          -v ${{ github.workspace }}:/github/workspace \
          --workdir /github/workspace \
          kivy/buildozer:latest \
          buildozer android debug

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: Finished-Android-APK
        path: bin/*.apk
